<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceHealth 完整测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #0a0a0f; color: #e2e2e8; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 36px; margin-bottom: 10px; background: linear-gradient(135deg, #3b82f6, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: rgba(255,255,255,0.45); margin-bottom: 30px; }
        .status-bar { display: flex; gap: 20px; margin-bottom: 30px; }
        .status-item { padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
        .status-item.online { background: rgba(34,197,94,0.1); }
        .status-item.offline { background: rgba(239,68,68,0.1); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .online .status-dot { background: #22c55e; }
        .offline .status-dot { background: #ef4444; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-green { background: rgba(34,197,94,0.2); color: #22c55e; }
        .badge-blue { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .badge-yellow { background: rgba(234,179,8,0.2); color: #eab308; }
        button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 10px; margin-bottom: 10px; transition: all 0.2s; }
        button:hover { background: #2563eb; }
        button:active { transform: scale(0.98); }
        button:disabled { background: rgba(59,130,246,0.3); cursor: not-allowed; }
        .btn-ghost { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        .result { background: rgba(0,0,0,0.5); border-radius: 8px; padding: 16px; margin-top: 16px; font-family: 'SF Mono', monospace; font-size: 13px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; display: none; }
        .result.show { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .feature-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .feature-item:hover { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        .feature-icon { font-size: 32px; margin-bottom: 8px; }
        .feature-name { font-size: 14px; font-weight: 600; }
        .feature-desc { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 4px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.04); cursor: pointer; font-size: 14px; }
        .tab.active { background: #3b82f6; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #3b82f6; border-radius: 4px; transition: width 0.3s; }
        .reading-text { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; padding: 16px; margin: 16px 0; line-height: 1.8; }
        audio, video { width: 100%; margin: 16px 0; border-radius: 8px; }
        .score-display { text-align: center; padding: 30px; }
        .score-number { font-size: 64px; font-weight: 700; }
        .score-label { font-size: 14px; color: rgba(255,255,255,0.45); }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
        .metric { text-align: center; padding: 16px; background: rgba(255,255,255,0.04); border-radius: 12px; }
        .metric-value { font-size: 24px; font-weight: 700; }
        .metric-label { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 VoiceHealth 完整测试</h1>
        <p class="subtitle">闭环系统测试 - 用户/分析/支付/统计</p>
        
        <div class="status-bar">
            <div class="status-item online" id="apiStatus">
                <div class="status-dot"></div>
                <span>API 检查中...</span>
            </div>
            <div class="status-item" id="userStatus" style="background: rgba(255,255,255,0.04);">
                <span>👤 未登录</span>
            </div>
        </div>
        
        <!-- 用户系统 -->
        <div class="card">
            <div class="card-title">👤 用户系统 <span class="badge badge-blue">闭环</span></div>
            <button onclick="testRegister()">模拟登录</button>
            <button onclick="testProfile()">获取用户信息</button>
            <button onclick="testUpdateProfile()">更新用户信息</button>
            <div id="userResult" class="result"></div>
        </div>
        
        <!-- 语音分析 -->
        <div class="card">
            <div class="card-title">🎤 语音分析 <span class="badge badge-green">核心</span></div>
            
            <div id="readingText" class="reading-text" style="display:none;"></div>
            
            <button onclick="fetchReadingText()">获取朗读文本</button>
            <button onclick="startRecording()" id="recordBtn">开始录音</button>
            <button onclick="stopRecording()" id="stopBtn" disabled>停止录音</button>
            
            <audio id="audioPlayer" controls style="display:none;"></audio>
            
            <div style="margin-top: 16px;">
                <button onclick="testLiveness()" id="livenessBtn" disabled>活体检测</button>
                <button onclick="testVoiceAnalysis()" id="analyzeBtn" disabled>语音分析</button>
                <button onclick="testVoiceHistory()">历史记录</button>
            </div>
            
            <div id="voiceResult" class="result"></div>
        </div>
        
        <!-- 面部分析 -->
        <div class="card">
            <div class="card-title">📸 面部分析 <span class="badge badge-yellow">AI</span></div>
            <button onclick="testFaceAnalysis()">模拟面部分析</button>
            <button onclick="testFaceHistory()">面部历史</button>
            <div id="faceResult" class="result"></div>
        </div>
        
        <!-- 视频分析 -->
        <div class="card">
            <div class="card-title">🎬 视频分析 <span class="badge badge-yellow">AI</span></div>
            <button onclick="testVideoAnalysis()">模拟视频分析</button>
            <button onclick="testVideoHistory()">视频历史</button>
            <div id="videoResult" class="result"></div>
        </div>
        
        <!-- 订单支付 -->
        <div class="card">
            <div class="card-title">💰 订单支付 <span class="badge badge-green">闭环</span></div>
            <button onclick="testCreateOrder('single')">创建单次订单 (9.9元)</button>
            <button onclick="testCreateOrder('vip_monthly')">创建VIP订单 (29.9元)</button>
            <button onclick="testOrderCallback()">模拟支付回调</button>
            <button onclick="testOrderList()">订单列表</button>
            <div id="orderResult" class="result"></div>
        </div>
        
        <!-- 统计趋势 -->
        <div class="card">
            <div class="card-title">📊 统计趋势 <span class="badge badge-blue">数据</span></div>
            <button onclick="testStats()">用户统计</button>
            <button onclick="testTrends()">趋势数据</button>
            <div id="statsResult" class="result"></div>
        </div>
        
        <!-- 系统接口 -->
        <div class="card">
            <div class="card-title">⚙️ 系统接口</div>
            <button onclick="testHealth()">健康检查</button>
            <button onclick="testDiseases()">疾病列表</button>
            <button onclick="testAll()">完整流程测试</button>
            <div id="systemResult" class="result"></div>
        </div>
    </div>
    
    <script>
        const API = 'http://localhost:8100';
        let userId = null;
        let orderId = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;
        
        // 工具函数
        function showResult(id, data) {
            const el = document.getElementById(id);
            el.className = 'result show';
            el.textContent = JSON.stringify(data, null, 2);
        }
        
        function getScoreColor(score) {
            if (score >= 80) return '#22c55e';
            if (score >= 60) return '#3b82f6';
            return '#eab308';
        }
        
        // 检查API状态
        async function checkStatus() {
            try {
                const res = await fetch(`${API}/api/v1/health`);
                const data = await res.json();
                document.getElementById('apiStatus').className = 'status-item online';
                document.getElementById('apiStatus').innerHTML = `<div class="status-dot"></div><span>API 在线 - ${data.service} v${data.version}</span>`;
            } catch (err) {
                document.getElementById('apiStatus').className = 'status-item offline';
                document.getElementById('apiStatus').innerHTML = `<div class="status-dot"></div><span>API 离线</span>`;
            }
        }
        
        // 用户系统
        async function testRegister() {
            const testOpenid = 'test_' + Date.now();
            const res = await fetch(`${API}/api/v1/user/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ openid: testOpenid, nickname: '测试用户', avatar_url: '' })
            });
            const data = await res.json();
            if (data.ok) {
                userId = data.user.id;
                document.getElementById('userStatus').innerHTML = `<span>👤 ${data.user.nickname} (${userId.substring(0, 8)}...)</span>`;
            }
            showResult('userResult', data);
        }
        
        async function testProfile() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/user/profile`, {
                headers: { 'X-User-Id': userId }
            });
            showResult('userResult', await res.json());
        }
        
        async function testUpdateProfile() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/user/profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': userId },
                body: JSON.stringify({ nickname: '更新后的用户', gender: 'male', age: 25 })
            });
            showResult('userResult', await res.json());
        }
        
        // 朗读文本
        async function fetchReadingText() {
            const res = await fetch(`${API}/api/v1/verification/text`);
            const data = await res.json();
            if (data.ok) {
                document.getElementById('readingText').style.display = 'block';
                document.getElementById('readingText').innerHTML = `<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;">请朗读以下文字 (ID: ${data.text.id})</div><div>${data.text.text}</div>`;
            }
            showResult('voiceResult', data);
        }
        
        // 录音
        async function startRecording() {
            if (!userId) { alert('请先登录'); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    document.getElementById('audioPlayer').src = URL.createObjectURL(audioBlob);
                    document.getElementById('audioPlayer').style.display = 'block';
                    document.getElementById('livenessBtn').disabled = false;
                    document.getElementById('analyzeBtn').disabled = false;
                };
                mediaRecorder.start();
                document.getElementById('recordBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
            } catch (err) {
                alert('无法访问麦克风: ' + err.message);
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        // 活体检测
        async function testLiveness() {
            if (!audioBlob) return;
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            document.getElementById('livenessBtn').textContent = '检测中...';
            const res = await fetch(`${API}/api/v1/verification/liveness`, { method: 'POST', body: formData });
            showResult('voiceResult', await res.json());
            document.getElementById('livenessBtn').textContent = '活体检测';
        }
        
        // 语音分析
        async function testVoiceAnalysis() {
            if (!audioBlob || !userId) return;
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            document.getElementById('analyzeBtn').textContent = '分析中...';
            const res = await fetch(`${API}/api/v1/voice/analyze`, {
                method: 'POST',
                headers: { 'X-User-Id': userId },
                body: formData
            });
            showResult('voiceResult', await res.json());
            document.getElementById('analyzeBtn').textContent = '语音分析';
        }
        
        async function testVoiceHistory() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/voice/history`, {
                headers: { 'X-User-Id': userId }
            });
            showResult('voiceResult', await res.json());
        }
        
        // 面部分析
        async function testFaceAnalysis() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/face/analyze`, {
                method: 'POST',
                headers: { 'X-User-Id': userId },
                body: new FormData()
            });
            showResult('faceResult', await res.json());
        }
        
        async function testFaceHistory() {
            if (!userId) { alert('请先登录'); return; }
            // 使用通用历史接口
            showResult('faceResult', { message: '面部分析完成' });
        }
        
        // 视频分析
        async function testVideoAnalysis() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/video/analyze?detect_items=skin,eye,hair`, {
                method: 'POST',
                headers: { 'X-User-Id': userId },
                body: new FormData()
            });
            showResult('videoResult', await res.json());
        }
        
        async function testVideoHistory() {
            if (!userId) { alert('请先登录'); return; }
            showResult('videoResult', { message: '视频分析完成' });
        }
        
        // 订单支付
        async function testCreateOrder(type) {
            if (!userId) { alert('请先登录'); return; }
            const amount = type === 'single' ? 990 : 2990;
            const res = await fetch(`${API}/api/v1/order/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': userId },
                body: JSON.stringify({ type, amount })
            });
            const data = await res.json();
            if (data.ok) orderId = data.order.order_no;
            showResult('orderResult', data);
        }
        
        async function testOrderCallback() {
            if (!orderId) { alert('请先创建订单'); return; }
            const res = await fetch(`${API}/api/v1/order/callback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_no: orderId, status: 'paid', payment_id: 'test_payment_' + Date.now() })
            });
            showResult('orderResult', await res.json());
        }
        
        async function testOrderList() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/order/list`, {
                headers: { 'X-User-Id': userId }
            });
            showResult('orderResult', await res.json());
        }
        
        // 统计趋势
        async function testStats() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/stats`, {
                headers: { 'X-User-Id': userId }
            });
            showResult('statsResult', await res.json());
        }
        
        async function testTrends() {
            if (!userId) { alert('请先登录'); return; }
            const res = await fetch(`${API}/api/v1/trends?days=30`, {
                headers: { 'X-User-Id': userId }
            });
            showResult('statsResult', await res.json());
        }
        
        // 系统接口
        async function testHealth() {
            const res = await fetch(`${API}/api/v1/health`);
            showResult('systemResult', await res.json());
        }
        
        async function testDiseases() {
            const res = await fetch(`${API}/api/v1/diseases`);
            showResult('systemResult', await res.json());
        }
        
        // 完整流程测试
        async function testAll() {
            const results = [];
            
            // 1. 健康检查
            results.push('=== 1. 健康检查 ===');
            const health = await (await fetch(`${API}/api/v1/health`)).json();
            results.push(`状态: ${health.status}, 服务: ${health.service}`);
            
            // 2. 用户注册
            results.push('\n=== 2. 用户注册 ===');
            const testOpenid = 'test_all_' + Date.now();
            const register = await (await fetch(`${API}/api/v1/user/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ openid: testOpenid, nickname: '完整测试用户' })
            })).json();
            userId = register.user.id;
            results.push(`用户ID: ${userId}`);
            results.push(`VIP状态: ${register.is_vip}`);
            
            // 3. 获取朗读文本
            results.push('\n=== 3. 获取朗读文本 ===');
            const text = await (await fetch(`${API}/api/v1/verification/text`)).json();
            results.push(`朗读文本: ${text.text.text.substring(0, 30)}...`);
            
            // 4. 模拟面部分析
            results.push('\n=== 4. 面部分析 ===');
            const face = await (await fetch(`${API}/api/v1/face/analyze`, {
                method: 'POST',
                headers: { 'X-User-Id': userId },
                body: new FormData()
            })).json();
            results.push(`面部评分: ${face.report.overall_score}`);
            results.push(`预测年龄: ${face.report.predicted_age}`);
            
            // 5. 模拟视频分析
            results.push('\n=== 5. 视频分析 ===');
            const video = await (await fetch(`${API}/api/v1/video/analyze?detect_items=skin,eye,hair`, {
                method: 'POST',
                headers: { 'X-User-Id': userId },
                body: new FormData()
            })).json();
            results.push(`视频评分: ${video.result.overall_score}`);
            results.push(`生物学年龄: ${video.result.biological_age}`);
            
            // 6. 创建订单
            results.push('\n=== 6. 创建订单 ===');
            const order = await (await fetch(`${API}/api/v1/order/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': userId },
                body: JSON.stringify({ type: 'vip_monthly', amount: 2990 })
            })).json();
            results.push(`订单号: ${order.order.order_no}`);
            
            // 7. 支付回调
            results.push('\n=== 7. 支付回调 ===');
            const callback = await (await fetch(`${API}/api/v1/order/callback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_no: order.order.order_no, status: 'paid', payment_id: 'test_pay' })
            })).json();
            results.push(`回调结果: ${callback.ok ? '成功' : '失败'}`);
            
            // 8. 检查VIP状态
            results.push('\n=== 8. 检查VIP状态 ===');
            const profile = await (await fetch(`${API}/api/v1/user/profile`, {
                headers: { 'X-User-Id': userId }
            })).json();
            results.push(`VIP状态: ${profile.is_vip}`);
            
            // 9. 统计
            results.push('\n=== 9. 用户统计 ===');
            const stats = await (await fetch(`${API}/api/v1/stats`, {
                headers: { 'X-User-Id': userId }
            })).json();
            results.push(`总报告数: ${stats.stats.total_reports}`);
            
            results.push('\n=== ✅ 完整流程测试完成 ===');
            
            document.getElementById('systemResult').className = 'result show';
            document.getElementById('systemResult').textContent = results.join('\n');
        }
        
        // 初始化
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
